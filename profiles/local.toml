[model]
provider = "ollama"
name = "qwen3:4b"
# The address is the only line here that a different machine may need. It is resolved in one order -
# this value, then OLLAMA_HOST, then Ollama's own row in the provider table - so a machine running the
# service on another port can delete this line or set the variable, and no code has to change.
endpoint = "http://127.0.0.1:11434"

[limits]
max_turns = 12
timeout_seconds = 120
context_chars = 24000
output_tokens = 4096
