# Google Gemini: fast hosted inference via Google AI Studio (OpenAI-compatible endpoint).
# The key is read from GEMINI_API_KEY (or GOOGLE_API_KEY).
[model]
provider = "gemini"
name = "gemini-3.8-flash"
endpoint = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"

[limits]
max_turns = 8
timeout_seconds = 120
context_chars = 32000
output_tokens = 4096
