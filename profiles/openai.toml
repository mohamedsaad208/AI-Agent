# OpenAI: hosted, and the most expensive way to run this tool. The cloud consent switch still applies.
[model]
provider = "openai"
name = "gpt-4o-mini"
endpoint = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[limits]
max_turns = 8
timeout_seconds = 180
context_chars = 24000
output_tokens = 4096
