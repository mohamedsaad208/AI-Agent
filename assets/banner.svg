<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1035"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="sphere-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="120" r="180" fill="url(#sphere-glow)"/>
  <circle cx="1000" cy="280" r="220" fill="url(#sphere-glow)" opacity="0.7"/>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="398" fill="none" stroke="#334155" stroke-width="1.5" rx="16"/>

  <!-- Central Content -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Icon Container -->
    <g transform="translate(0, -55)">
      <rect x="-45" y="-45" width="90" height="90" rx="22" fill="#1E293B" stroke="url(#accent-grad)" stroke-width="2.5"/>
      <!-- Terminal / Code / AI icon -->
      <path d="M -20 -10 L -8 0 L -20 10 M 0 12 L 18 12" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14" cy="-14" r="5" fill="#EC4899" filter="url(#glow)"/>
    </g>

    <!-- Project Title -->
    <text y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="2" fill="#F8FAFC">
      AI CODE <tspan fill="url(#accent-grad)">ENGINEER</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="4">
      AUTONOMOUS • ZERO-TRUST • MULTI-PROVIDER • SELF-HEALING
    </text>
  </g>

  <!-- Badges row inside Banner -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <!-- Local Badge -->
    <g transform="translate(-240, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2" opacity="0.9"/>
      <circle cx="-68" cy="0" r="4" fill="#06B6D4"/>
      <text x="6" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">100% Local / Ollama</text>
    </g>

    <!-- Zero-Trust Badge -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.2" opacity="0.9"/>
      <circle cx="-68" cy="0" r="4" fill="#8B5CF6"/>
      <text x="6" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Zero-Trust Sandbox</text>
    </g>

    <!-- Self Healing Badge -->
    <g transform="translate(240, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1E293B" stroke="#EC4899" stroke-width="1.2" opacity="0.9"/>
      <circle cx="-68" cy="0" r="4" fill="#EC4899"/>
      <text x="6" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Automated Test Loops</text>
    </g>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 25 45 L 25 25 L 45 25" fill="none" stroke="#06B6D4" stroke-width="2.5" opacity="0.7"/>
  <path d="M 1175 45 L 1175 25 L 1155 25" fill="none" stroke="#8B5CF6" stroke-width="2.5" opacity="0.7"/>
  <path d="M 25 355 L 25 375 L 45 375" fill="none" stroke="#8B5CF6" stroke-width="2.5" opacity="0.7"/>
  <path d="M 1175 355 L 1175 375 L 1155 375" fill="none" stroke="#EC4899" stroke-width="2.5" opacity="0.7"/>
</svg>
