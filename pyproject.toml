[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-engineer"
version = "0.1.0"
description = "A local-first, review-first developer agent for Ollama and OpenRouter"
requires-python = ">=3.11"
dependencies = []

# Optional, opt-in extras. The application runs fully with `dependencies = []`; nothing here is
# imported unless the operator both installs the package and points a setting or environment
# variable at local files. `semantic` adds meaning-based retrieval on top of the existing lexical
# search (`semantic.py`); it is inert without a local FastEmbed model folder, and never downloads
# a model at run time. `eval` is a development-only tool and is not imported by the app.
[project.optional-dependencies]
semantic = ["fastembed>=0.3,<0.5"]
dev = ["promptfoo"]

[project.scripts]
agent = "ai_code_engineer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# webapp/server.py resolves `STATIC = Path(__file__).resolve().parent / "static"` at runtime,
# so the UI has to travel inside the package. Without this the built wheel contains only .py
# files and an installed app starts with a blank window. `static/*` also covers any file later
# added to that folder, which is the only place under src/ holding non-.py resources today.
[tool.setuptools.package-data]
"ai_code_engineer.webapp" = ["static/*"]
