[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-engineer"
version = "0.1.0"
description = "A local-first, review-first developer agent for Ollama and OpenRouter"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent = "ai_code_engineer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# webapp/server.py resolves `STATIC = Path(__file__).resolve().parent / "static"` at runtime,
# so the UI has to travel inside the package. Without this the built wheel contains only .py
# files and an installed app starts with a blank window. `static/*` also covers any file later
# added to that folder, which is the only place under src/ holding non-.py resources today.
[tool.setuptools.package-data]
"ai_code_engineer.webapp" = ["static/*"]
